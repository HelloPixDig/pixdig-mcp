name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: agent
    attributes:
      label: Agent
      description: Claude Code, Codex, Cursor, Gemini CLI…
    validations: { required: true }
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "node --version"
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: PixDig MCP version
      placeholder: "0.2.0"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the tool call (name and arguments) and the answer you received.
    validations: { required: true }
